<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>View Scan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="segment.css" />
  </head>

  <body class="simulator-body">
    <header class="top-header">
      <div class="header-left">
        <img src="Images/logo.png" alt="Logo" />
        <h1>Advancing Medicine with Technology & AI</h1>
      </div>
    </header>

    <div class="simulator-wrapper">
      <div class="simulator-container">
        <!-- MENU -->
        <div class="menu-panel">
          <a href="upload-scan.html" class="menu-btn">Upload Scan</a>
          <a href="segment.html" class="menu-btn">Segment</a>
          <a href="view.html" class="menu-btn active">View</a>
          <a href="assess-wound.html" class="menu-btn">Assess Wound</a>
          <a href="print.html" class="menu-btn">Print</a>
          <a href="edit-profile.html" class="menu-btn">Edit Profile</a>
          <a href="#" class="menu-btn">Save</a>
          <a href="index.html" class="menu-btn logout">Log Out</a>
        </div>

        <!-- CONTENT -->
        <div class="display-panel">
          <h2 class="page-title">View Scan</h2>

          <div class="viewer-container">
            <div id="viewer">
              <p id="placeholder">No scan loaded</p>
            </div>

            <!-- CONTROLS -->
            <div class="viewer-controls">
              <button class="viewer-btn primary" id="zoomIn">+</button>
              <button class="viewer-btn primary" id="zoomOut">−</button>
              <button class="viewer-btn" id="rotate">↻</button>
              <button class="viewer-btn secondary" id="reset">Reset</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="view.js"></script>
  </body>
</html>
