<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Surgic Sense</title>

  <link rel="stylesheet" href="styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js" defer></script>
</head>

<body>

  <header class="top-header">
    <div class="header-left">
      <img src="Images/logo.png" alt="Logo">
      <h1>Advancing Medicine with Technology & AI</h1>
    </div>
  </header>

  <nav class="compact-nav">
    <ul>
      <li><a href="home.html"><ion-icon name="home-outline"></ion-icon><span>Home</span></a></li>
      <li><a href="AboutUs.html"><ion-icon name="person-outline"></ion-icon><span>About Us</span></a></li>
      <li><a href="information.html"><ion-icon name="information-circle-outline"></ion-icon><span>Information</span></a></li>
      <li><a href="demo.html"><ion-icon name="play-circle-outline"></ion-icon><span>Demo</span></a></li>
      <li><a href="ContactUS.html"><ion-icon name="mail-outline"></ion-icon><span>Contact</span></a></li>
      <li><a href="login.html"><ion-icon name="medkit-outline"></ion-icon><span>Log in for Surgeons</span></a></li>
    </ul>
  </nav>

  <script>
    const currentPage = location.pathname.split("/").pop();
    document.querySelectorAll('.compact-nav a').forEach(link => {
      if (link.getAttribute('href') === currentPage) {
        link.parentElement.classList.add('active');
      }
    });
  </script>

  <main>
    <div class="hero">
      <form id="contactForm">
        <div class="input-group">
          <input type="text" id="name" name="name" required>
          <label for="name"><i class="fas fa-user"></i> Your name</label>
        </div>

        <div class="input-group">
          <input type="email" id="email" name="email" required>
          <label for="email"><i class="fas fa-envelope"></i> Your e-mail</label>
        </div>

        <div class="input-group">
          <textarea id="message" name="message" rows="8" required></textarea>
          <label for="message"><i class="fas fa-comments"></i> Your message</label>
        </div>

        <button type="submit">SUBMIT <i class="fas fa-paper-plane"></i></button>
      </form>

      <script>
        document.getElementById("contactForm").addEventListener("submit", function(event) {
          event.preventDefault();

          let formData = new FormData(this);

          Swal.fire({
            icon: "success",
            title: "Message Sent!",
            text: "Your message has been sent successfully.",
            timer: 2000,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "home.html";
          });
        });
      </script>
    </div>
  </main>

</body>
</html>
